async function receiveCall(m){
 if(m.to!==user)return;
 if(m.type==='ring'){
  if(call){if(call.token!==m.token)await postSignal({id:m.from,edge:m.edge,token:m.token},'end');return}
  const c=call={id:m.from,edge:m.edge,video:m.video===true,token:m.token,ice:[]};
  armCall(c);callPanel('Incoming '+(c.video?'video':'voice')+' call from '+label(c.id),true);return
 }
 const c=call;if(!c||c.token!==m.token||c.id!==m.from)return;
 try{
  if(m.type==='end'){finishCall(false);tell('Call ended.');return}
  if(m.type==='accept'&&!c.pc){callPanel('Connecting…');if(!await setupCall(c))return;await c.pc.setLocalDescription(await c.pc.createOffer());if(call===c)await postSignal(c,'offer',{sdp:c.pc.localDescription.toJSON()})}
  if(m.type==='offer'||m.type==='answer'){
   await c.pc.setRemoteDescription(m.sdp);
   for(const ice of c.ice.splice(0))await c.pc.addIceCandidate(ice);
   if(m.type==='offer'){await c.pc.setLocalDescription(await c.pc.createAnswer());if(call===c)await postSignal(c,'answer',{sdp:c.pc.localDescription.toJSON()})}
  }
  if(m.type==='ice'){if(c.pc?.remoteDescription)await c.pc.addIceCandidate(m.candidate);else c.ice.push(m.candidate)}
 }catch(err){if(call===c){finishCall();tell('Call failed: '+err.message)}}
}

  window.replyHistory=async function(edge,room,id){
    const ref=edge?threadMessages(edge):roomMessages(room);
    const target=await getDoc(doc(ref,id));if(!target.exists())throw Error('This message is no longer available.');
    const history=await getDocs(query(ref,orderBy('createdAt','desc'),startAt(target),limit(12)));
    return history.docs.reverse().map(d=>({id:d.id,...d.data()}))
  };
  window.publicRooms={
    watch:(room,receive,fail)=>onSnapshot(query(roomMessages(room),orderBy('createdAt','desc'),limit(100)),{includeMetadataChanges:true},receive,fail),
    send:(room,name,text,reply)=>addDoc(roomMessages(room),{uid:service.currentUser.uid,name,text,...(reply?{reply}:{}),createdAt:serverTimestamp()})
  };
  try { await setPersistence(service,browserSessionPersistence) }
  catch { await setPersistence(service,inMemoryPersistence) }
  window.arcadeAccounts={
    current:()=>service.currentUser,
    register:(email,password)=>createUserWithEmailAndPassword(service,email,password),
    login:(email,password)=>signInWithEmailAndPassword(service,email,password),
    logout:()=>signOut(service),
    rename:async(account,name)=>{await updateProfile(account,{displayName:name});await publishPlayer(account)}
  };
  onAuthStateChanged(service,account=>{
    syncPlayer(account);followFriends(account);if(account)publishPlayer(account).catch(err=>tell(err.message));
    if(!document.body.classList.contains('playing')&&!document.querySelector('dialog[open]')&&(current===4||current===2))show(current===2&&!account?0:current);
  });
</script>
