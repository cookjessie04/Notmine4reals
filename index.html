const gameIdOffset=7;
for(const item of imports){games.push(item.name);genres.push("Web game")}
const featuredGames=games.slice(0,5);
function carousel(){
 const order=[featuredGames.length-1,...featuredGames.keys(),0];
 const posters=order.map((i,pos)=>'<button class="poster" data-index="'+i+'" aria-label="Play '+games[i]+'" onclick="play('+i+')">'+libraryArt(i)+'<span><small>'+genres[i]+'</small><strong>'+games[i]+'</strong></span></button>').join('');
 return '<section class="orbit" aria-label="Featured games"><div class="track">'+posters+'</div></section>'
}
let trackPosition=1;
function rotate(step){
 clearTimeout(carouselTimer);
 const track=$('.track');if(!track)return;
 function position(animate){
  track.classList.toggle('moving',animate);
  track.style.transform='translateX(calc('+(-trackPosition*86)+'% - '+(trackPosition*12)+'px))';
 }
 if(!step||trackPosition===0||trackPosition===featuredGames.length+1){
  trackPosition=slide+1;position(false);void track.offsetWidth;
 }
 trackPosition+=step;slide=(slide+step+featuredGames.length)%featuredGames.length;position(Boolean(step));
 track.ontransitionend=e=>{if(e.target===track&&(trackPosition===0||trackPosition===featuredGames.length+1)){trackPosition=slide+1;position(false)}};
 track.querySelectorAll('.poster').forEach((el,i)=>el.tabIndex=i===slide+1?0:-1);

 if(!paused&&preferences.autoplay&&!document.hidden)carouselTimer=setTimeout(()=>rotate(1),4800)

  event.preventDefault();const submit=form.querySelector('.primary');if(submit.disabled)return;

  const useHandle=reg?!email:!email.includes('@');

  if(useHandle&&!validHandle(handle)){errorBox.textContent='For username sign-in, use 3–24 letters, numbers, or underscores.';return}

   let notice='';

   closeBox();show(destination);

}

  if(inboxes.has(row.id))continue;

   if(session!==friendSession||inboxes.get(row.id)!==item)return;

async function preparePhoto(file){

 try{
  img.src=url;await img.decode();
  const canvas=document.createElement('canvas');
  let scale=Math.min(1,1200/Math.max(img.naturalWidth,img.naturalHeight));
  for(let attempt=0;attempt<8;attempt++,scale*=0.75){
   canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
   canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
   const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
   ctx.drawImage(img,0,0,canvas.width,canvas.height);
   const jpeg=canvas.toDataURL('image/jpeg',0.8);
   if(jpeg.startsWith('data:image/jpeg;base64,')&&jpeg.length<=240000)return jpeg
  }
  throw Error('Choose a smaller photo.')
 }finally{URL.revokeObjectURL(url)}
}

   const payload=kind==='text'?{text:data}:{kind,image:await preparePhoto(data)};
   await window.playerNetwork.sendMessage(edge.id,payload);return true

async function setupCall(c){
 if(!navigator.mediaDevices?.getUserMedia)throw Error('Camera and microphone access require a secure page with device permissions.');
 const policy=document.permissionsPolicy||document.featurePolicy;
 const required=c.video?['microphone','camera']:['microphone'];
 const blocked=required.filter(device=>policy?.allowsFeature?.(device)===false);
 if(blocked.length)throw Error('This page blocks '+blocked.join(' and ')+'. '+(window.self!==window.top?'Open the arcade at its own HTTPS address or enable these permissions on the hosting iframe.':'Check the hosting site’s permissions policy.'));
 let stream;
 try{stream=await navigator.mediaDevices.getUserMedia({audio:true,video:c.video})}
 catch(err){
  if(err.name==='NotAllowedError'||err.name==='SecurityError')throw Error('Device access denied. Allow '+required.join(' and ')+' in your browser’s site settings, check your device privacy settings, then retry.'+(window.self!==window.top?' If there is no permission prompt, test the arcade at its own HTTPS address.':''));
  if(err.name==='NotFoundError')throw Error('No available '+(c.video?'camera or microphone':'microphone')+' was found.');
  throw err
 }
 if(call!==c){stream.getTracks().forEach(t=>t.stop());return false}
 c.stream=stream;$('#call-mute').disabled=false;
 $('#dm-self').hidden=!c.video;if(c.video)$('#dm-self').srcObject=stream;
 const pc=c.pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},...(window.arcadeTurnServers||[])]});
 for(const track of stream.getTracks())pc.addTrack(track,stream);
 pc.onicecandidate=e=>{if(e.candidate&&call===c)postSignal(c,'ice',{candidate:e.candidate.toJSON()}).catch(err=>{if(call===c)tell(err.message)})};
 pc.ontrack=e=>{if(call!==c)return;$('#dm-remote').srcObject=e.streams[0];$('#dm-callbox').classList.toggle('streaming',c.video);$('#call-pip').hidden=!c.video||!document.pictureInPictureEnabled;resumeRemote()};
 pc.onconnectionstatechange=()=>{if(call!==c)return;if(pc.connectionState==='connected'){clearTimeout(c.timeout);callPanel('In call with '+label(c.id))}if(pc.connectionState==='failed'){finishCall();tell('Connection failed. This network may need a TURN relay.')}};
 return true
}

}
async function receiveCall(m){
 if(m.to!==user)return;
 if(m.type==='ring'){
  if(call){if(call.token!==m.token)await postSignal({id:m.from,edge:m.edge,token:m.token},'end');return}
  const c=call={id:m.from,edge:m.edge,video:m.video===true,token:m.token,ice:[]};
  armCall(c);callPanel('Incoming '+(c.video?'video':'voice')+' call from '+label(c.id),true);return
 }
 const c=call;if(!c||c.token!==m.token||c.id!==m.from)return;
 try{
  if(m.type==='end'){finishCall(false);tell('Call ended.');return}
  if(m.type==='accept'&&!c.pc){callPanel('Connecting…');if(!await setupCall(c))return;await c.pc.setLocalDescription(await c.pc.createOffer());if(call===c)await postSignal(c,'offer',{sdp:c.pc.localDescription.toJSON()})}

   await c.pc.setRemoteDescription(m.sdp);
   for(const ice of c.ice.splice(0))await c.pc.addIceCandidate(ice);
   if(m.type==='offer'){await c.pc.setLocalDescription(await c.pc.createAnswer());if(call===c)await postSignal(c,'answer',{sdp:c.pc.localDescription.toJSON()})}
  }
  if(m.type==='ice'){if(c.pc?.remoteDescription)await c.pc.addIceCandidate(m.candidate);else c.ice.push(m.candidate)}
 }catch(err){if(call===c){finishCall();tell('Call failed: '+err.message)}}
}
